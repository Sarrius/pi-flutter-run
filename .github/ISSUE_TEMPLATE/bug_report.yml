name: Bug report
description: Report a reproducible problem with pi-flutter-run
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail to reproduce it.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Pi in ...
        2. Run /flutter-run
        3. Select config ...
        4. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / logs
      render: text
    validations:
      required: true
  - type: input
    id: pi-version
    attributes:
      label: Pi Agent version
      placeholder: "pi --version"
    validations:
      required: false
  - type: input
    id: flutter-version
    attributes:
      label: Flutter version
      placeholder: "flutter --version"
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: launch-config
    attributes:
      label: Relevant launch.json config
      render: json
    validations:
      required: false
